{{- if and .Values.migrate.enabled .Values.microservices.platform.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: aiops-migrate
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      {{- include "aiops.imagePullSecrets" . | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "aiops.image" (dict "root" . "svcName" .Values.microservices.platform.name "Values" .Values) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/app/migrate"]
          env:
            - name: EWA_CONFIG
              value: /app/config/config.yaml
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "aiops.fullname" . }}-config
{{- end }}
