{{- if .Values.microservices.pluginKubernetes.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.microservices.pluginKubernetes.serviceAccount }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.microservices.pluginKubernetes.serviceAccount }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.microservices.pluginKubernetes.serviceAccount }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.microservices.pluginKubernetes.serviceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.microservices.pluginKubernetes.serviceAccount }}
{{- end }}
