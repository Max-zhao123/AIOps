{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freeaiops.mysql.fullname" . }}
  labels:
    {{- include "freeaiops.mysqlLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mysql.service.port }}
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "freeaiops.mysqlLabels" . | nindent 4 }}
{{- end }}
