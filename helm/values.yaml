# 全局
nameOverride: ""
fullnameOverride: ""

# 拉取私有镜像（如华为 SWR）所需的 Secret
imagePullSecrets:
  - name: default-secret

# 应用镜像（由 buildall.sh 构建）
image:
  repository: swr.cn-south-1.myhuaweicloud.com/ops-images/aiops
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: aiops.tclpv.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - aiops.tclpv.com
      secretName: tclpv.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# 应用配置
config:
  domain: localhost
  admin:
    enable: true
    auth: true
  jwt:
    signingKey: aiops
    expiresTime: 604800000
    bufferTime: 86400000
    issuer: aiops

# 数据库迁移 Job（首次安装时执行）
migrate:
  enabled: true
  backoffLimit: 3

# MySQL 中间件（副本固定为 1，勿与 replicaCount 混淆）
mysql:
  enabled: true
  replicaCount: 1
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  auth:
    rootPassword: "YfZqL98*901"
    database: aiops
    username: root
  service:
    port: 3306
  persistence:
    enabled: true
    # false：不创建 PVC，请自行创建后填写 existingClaim
    createPVC: false
    existingClaim: aiops-mysql
    size: 8Gi
    storageClass: ""
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# 使用外部 MySQL 时设置 mysql.enabled=false 并配置 externalMysql
externalMysql:
  host: ""
  port: "3306"
  database: aiops
  username: root
  password: ""
