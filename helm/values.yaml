# 全局
nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: default-secret

# 镜像仓库前缀（buildall.sh REGISTRY 需一致）
imageRegistry: swr.cn-south-1.myhuaweicloud.com/ops-images/
imageTag: latest
imagePullPolicy: Always

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: aiops.tclpv.com
      paths:
        - path: /api/
          pathType: Prefix
          backend: gateway
        - path: /admin/
          pathType: Prefix
          backend: gateway
        - path: /
          pathType: Prefix
          backend: frontend
  tls:
    - hosts:
        - aiops.tclpv.com
      secretName: tclpv.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# 微服务（阶段 A Pod，见 ARCHITECTURE.md）
microservices:
  gateway:
    enabled: true
    name: aiops-gateway
    port: 8080
    replicas: 1
    mountConfig: true
  platform:
    enabled: true
    name: aiops-platform
    port: 8081
    replicas: 1
    mountConfig: true
  chat:
    enabled: true
    name: aiops-chat
    port: 8082
    replicas: 1
    mountConfig: true
  policy:
    enabled: true
    name: aiops-policy
    port: 8083
    replicas: 1
    mountConfig: true
  executor:
    enabled: true
    name: aiops-executor
    port: 8084
    replicas: 1
    mountConfig: true
  pluginMock:
    enabled: true
    name: aiops-plugin-mock
    port: 8090
    replicas: 1
  pluginKubernetes:
    enabled: true
    name: aiops-plugin-kubernetes
    port: 8091
    replicas: 1
    serviceAccount: aiops-plugin-kubernetes
  pluginPrometheus:
    enabled: true
    name: aiops-plugin-prometheus
    port: 8092
    replicas: 1
  pluginLogs:
    enabled: true
    name: aiops-plugin-logs
    port: 8093
    replicas: 1
  moduleKb:
    enabled: true
    name: aiops-module-kb
    port: 8085
    replicas: 1
    mountConfig: true
  worker:
    enabled: true
    name: aiops-worker
    port: 8086
    replicas: 1

# 集群内集成（联调时按环境填写；空则部分能力不可用）
integrations:
  llm:
    baseUrl: ""
    apiKey: ""
    model: ""
  prometheusUrl: ""
  logsUrl: ""

config:
  domain: aiops.tclpv.com
  admin:
    enable: true
    auth: true
  jwt:
    signingKey: aiops
    expiresTime: 604800000
    bufferTime: 86400000
    issuer: aiops

# 前端 SPA
frontend:
  enabled: true
  name: aiops-frontend
  port: 80
  replicas: 1
  image: aiops-frontend

migrate:
  enabled: true
  backoffLimit: 3

mysql:
  enabled: true
  replicaCount: 1
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  auth:
    rootPassword: "YfZqL98*901"
    database: aiops
    username: root
  service:
    port: 3306
  persistence:
    enabled: true
    createPVC: false
    existingClaim: aiops-mysql
    size: 8Gi
    storageClass: ""
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

externalMysql:
  host: ""
  port: "3306"
  database: aiops
  username: root
  password: ""
